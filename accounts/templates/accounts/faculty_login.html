{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login | PracticalHUB</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #070b14;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border: 1px solid #243247;
            border-radius: 16px;
            background: #101827;
            box-shadow: 0 0 35px rgba(0, 225, 255, 0.08);
        }

        .logo {
            color: #22d3ee;
            font-size: 27px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 17px 0 8px;
            font-size: 14px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #334155;
            outline: none;
            background: #080f1c;
            color: white;
        }

        input:focus {
            border-color: #22d3ee;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #06b6d4;
            color: #07111b;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #22d3ee;
        }

        .error {
            margin-top: 15px;
            padding: 10px;
            border-radius: 7px;
            color: #fecaca;
            background: #451a1a;
            font-size: 13px;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            color: #94a3b8;
            text-align: center;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: #22d3ee;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <div class="logo">PracticalHUB</div>
        <p class="subtitle">Faculty Access Portal</p>

        <form method="POST">
            {% csrf_token %}

            <input type="hidden" name="next" value="{{ request.GET.next }}">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter faculty username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

            {% if messages %}
                {% for message in messages %}
                    <div class="error">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <button type="submit">Login to Faculty Portal →</button>
        </form>

        <a href="/" class="back-link">← Back to PracticalHUB Home</a>
    </div>
</body>
</html>
